<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Free City China · Visitor</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f0f4f9;
            padding: 16px 16px 80px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .brand-header {
            background: linear-gradient(135deg, #0a1a2f 0%, #1a3050 100%);
            color: white;
            padding: 20px 24px;
            border-radius: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(10, 26, 47, 0.15);
        }
        .brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand i {
            color: #f59e0b;
            font-size: 1.2rem;
        }
        .brand small {
            font-weight: 400;
            font-size: 0.7rem;
            color: #8aa4c0;
            margin-left: 4px;
        }
        .cart-icon-wrapper {
            position: relative;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .cart-icon-wrapper:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .cart-icon-wrapper i {
            font-size: 1.2rem;
            color: white;
        }
        .cart-badge {
            background: #ef4444;
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 30px;
            min-width: 20px;
            text-align: center;
        }

        /* ===== PRODUCT GRID ===== */
        .visitor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            padding: 16px 14px 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef3f9;
            text-align: center;
            transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .product-card .product-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 16px;
            background: #f8fafc;
            margin: 0 auto 8px;
            display: block;
            padding: 4px;
        }
        .product-card .emoji-big {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 6px;
        }
        .product-card .product-name {
            font-weight: 600;
            color: #0b2a44;
            font-size: 0.95rem;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card .product-desc {
            font-size: 0.65rem;
            color: #5a6f88;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            min-height: 32px;
        }
        .product-card .price-tag {
            font-weight: 700;
            color: #1f5bb5;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .product-card .order-btn {
            background: linear-gradient(135deg, #1f5bb5, #1a4a9a);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            justify-content: center;
        }
        .product-card .order-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(31, 91, 181, 0.3);
        }
        .product-card .order-btn:active {
            transform: scale(0.96);
        }
        .product-card .qty-badge {
            background: #dbeafe;
            color: #1f5bb5;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
            display: inline-block;
        }
        .product-card .card-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #16a34a;
            color: white;
            font-size: 0.5rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 30px;
            opacity: 0;
            transition: 0.3s;
        }
        .product-card .card-badge.show {
            opacity: 1;
        }

        /* ===== ORDER SUMMARY ===== */
        .order-summary {
            background: white;
            padding: 20px 20px 24px;
            border-radius: 24px;
            border: 1px solid #eef3f9;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-top: 4px;
            transition: 0.3s;
        }
        .order-summary .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .order-summary .summary-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0b2a44;
        }
        .order-summary .total {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1f5bb5;
        }
        .order-items-list {
            margin: 8px 0 12px;
            padding: 0;
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .order-items-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f0f4fc;
            font-size: 0.85rem;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(-10px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .order-items-list li .item-info {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .order-items-list li .item-info .item-emoji {
            font-size: 1.2rem;
        }
        .order-items-list li .item-remove {
            background: none;
            border: none;
            color: #b0c2d4;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            padding: 0 4px;
        }
        .order-items-list li .item-remove:hover {
            color: #dc2626;
            transform: scale(1.1);
        }
        .order-items-list .empty-msg {
            color: #7a8ea5;
            padding: 8px 0;
            text-align: center;
            font-size: 0.85rem;
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 10px;
        }
        .form-row input,
        .form-row textarea {
            padding: 12px 16px;
            border: 2px solid #eef3f9;
            border-radius: 14px;
            background: #fafcff;
            font-size: 0.9rem;
            transition: 0.2s;
            font-family: inherit;
            width: 100%;
        }
        .form-row input:focus,
        .form-row textarea:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }
        .form-row textarea {
            resize: vertical;
            min-height: 50px;
        }
        .submit-order {
            background: linear-gradient(135deg, #1f5bb5, #1a4a9a);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 4px;
        }
        .submit-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(31, 91, 181, 0.3);
        }
        .submit-order:active {
            transform: scale(0.98);
        }
        .submit-order:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== PRODUCT DETAIL MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show {
            display: flex;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 28px 24px 24px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-content .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #f0f4fc;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            color: #1d3b5c;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content .modal-close:hover {
            background: #dce4ef;
        }
        .modal-content .modal-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 20px;
            background: #f8fafc;
            display: block;
            margin: 0 auto 12px;
            padding: 8px;
        }
        .modal-content .modal-emoji {
            font-size: 4rem;
            display: block;
            text-align: center;
            margin-bottom: 8px;
        }
        .modal-content .modal-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0b2a44;
            text-align: center;
        }
        .modal-content .modal-desc {
            font-size: 0.9rem;
            color: #5a6f88;
            text-align: center;
            margin: 4px 0 12px;
            line-height: 1.5;
        }
        .modal-content .modal-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1f5bb5;
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-content .modal-stock {
            font-size: 0.8rem;
            color: #5a6f88;
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-content .modal-add-btn {
            background: linear-gradient(135deg, #1f5bb5, #1a4a9a);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modal-content .modal-add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(31, 91, 181, 0.3);
        }

        /* ===== PRODUCT DETAILS LIST VIEW ===== */
        .product-detail-list {
            background: white;
            border-radius: 24px;
            padding: 20px 18px;
            margin-bottom: 20px;
            border: 1px solid #eef3f9;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .product-detail-list .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f4fc;
        }
        .product-detail-list .list-header h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0b2a44;
        }
        .product-detail-list .list-header .count-badge {
            background: #f0f4fc;
            color: #1d3b5c;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .product-detail-item {
            display: flex;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f4fc;
            cursor: pointer;
            transition: 0.2s;
        }
        .product-detail-item:hover {
            background: #f8fafc;
            margin: 0 -8px;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: 12px;
        }
        .product-detail-item:last-child {
            border-bottom: none;
        }
        .product-detail-item .pdi-img {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
            background: #f8fafc;
            flex-shrink: 0;
            padding: 4px;
        }
        .product-detail-item .pdi-info {
            flex: 1;
            min-width: 0;
        }
        .product-detail-item .pdi-info .pdi-name {
            font-weight: 600;
            color: #0b2a44;
            font-size: 0.9rem;
        }
        .product-detail-item .pdi-info .pdi-desc {
            font-size: 0.7rem;
            color: #5a6f88;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-detail-item .pdi-info .pdi-meta {
            display: flex;
            gap: 12px;
            margin-top: 2px;
            font-size: 0.7rem;
            color: #5a6f88;
        }
        .product-detail-item .pdi-info .pdi-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .product-detail-item .pdi-price {
            font-weight: 700;
            color: #1f5bb5;
            font-size: 0.95rem;
            white-space: nowrap;
            align-self: center;
        }
        .product-detail-item .pdi-add {
            background: none;
            border: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.2s;
            align-self: center;
        }
        .product-detail-item .pdi-add:hover {
            background: #dbeafe;
        }
        .product-detail-item .pdi-qty {
            background: #dbeafe;
            color: #1f5bb5;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            align-self: center;
        }

        /* ===== TOAST ===== */
        .toast {
            background: #0a1a2f;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            font-weight: 500;
            font-size: 0.85rem;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== LOADING / ERROR ===== */
        .loading-msg {
            color: #5a6f88;
            padding: 40px 0;
            text-align: center;
            grid-column: 1/-1;
            font-size: 0.9rem;
        }
        .error-msg {
            color: #c0392b;
            padding: 20px;
            text-align: center;
            grid-column: 1/-1;
            background: #fff5f5;
            border-radius: 16px;
            border: 1px solid #fecaca;
        }
        .error-msg button {
            margin-top: 12px;
            background: #1a2f4f;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .error-msg button:hover {
            background: #0b1f35;
        }
        .empty-msg {
            color: #7a8ea5;
            padding: 8px 0;
            text-align: center;
        }

        /* ===== TOGGLE VIEW BUTTON ===== */
        .view-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: flex-end;
        }
        .view-toggle button {
            background: white;
            border: 1px solid #eef3f9;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1d3b5c;
            cursor: pointer;
            transition: 0.2s;
        }
        .view-toggle button.active {
            background: #0a1a2f;
            color: white;
            border-color: #0a1a2f;
        }
        .view-toggle button i {
            margin-right: 4px;
        }
        .view-toggle button:hover:not(.active) {
            background: #f0f4fc;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .visitor-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .product-card {
                padding: 12px 10px 14px;
            }
            .product-card .product-img {
                width: 60px;
                height: 60px;
            }
            .product-card .emoji-big {
                font-size: 2rem;
            }
            .product-card .product-name {
                font-size: 0.8rem;
            }
            .product-card .price-tag {
                font-size: 0.95rem;
            }
            .product-card .order-btn {
                font-size: 0.65rem;
                padding: 6px 12px;
            }
            .brand {
                font-size: 1.1rem;
            }
            .modal-content {
                padding: 20px 16px;
            }
            .product-detail-item .pdi-img {
                width: 44px;
                height: 44px;
            }
            .product-detail-item .pdi-info .pdi-name {
                font-size: 0.8rem;
            }
            .product-detail-item .pdi-price {
                font-size: 0.8rem;
            }
        }
        @media (min-width: 600px) {
            .visitor-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- ===== HEADER ===== -->
    <header class="brand-header">
        <div class="brand">
            <i class="fas fa-city"></i> Free City China
            <small>· 自由城</small>
        </div>
        <div class="cart-icon-wrapper" id="cartToggle">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
    </header>

    <!-- ===== VIEW TOGGLE ===== -->
    <div class="view-toggle">
        <button class="active" id="gridViewBtn"><i class="fas fa-th"></i> Grid</button>
        <button id="listViewBtn"><i class="fas fa-list"></i> List</button>
    </div>

    <!-- ===== PRODUCT GRID ===== -->
    <div class="visitor-grid" id="productGrid">
        <div class="loading-msg"><i class="fas fa-spinner fa-pulse"></i> Loading products...</div>
    </div>

    <!-- ===== PRODUCT DETAILS LIST ===== -->
    <div class="product-detail-list" id="productDetailList" style="display:none;">
        <div class="list-header">
            <h4><i class="fas fa-list-ul" style="color:#2563eb;"></i> Product Details</h4>
            <span class="count-badge" id="productCountBadge">0 items</span>
        </div>
        <div id="productListItems">
            <div class="empty-msg" style="padding:20px 0;">No products available.</div>
        </div>
    </div>

    <!-- ===== ORDER SUMMARY ===== -->
    <div class="order-summary" id="orderSummary">
        <div class="summary-header">
            <h3><i class="fas fa-receipt" style="color:#2563eb;"></i> Your Order</h3>
            <span class="total" id="totalPrice">৳0.00</span>
        </div>
        <ul class="order-items-list" id="orderItemsList">
            <li class="empty-msg">No items added yet.</li>
        </ul>
        <div class="form-row">
            <input type="text" id="custName" placeholder="Full name *" />
            <input type="text" id="custAddress" placeholder="Address *" />
            <input type="tel" id="custPhone" placeholder="Phone *" />
            <textarea id="custNotes" placeholder="Order notes (optional)"></textarea>
        </div>
        <button class="submit-order" id="submitOrderBtn">
            <i class="fas fa-paper-plane"></i> Place Order
        </button>
    </div>

    <!-- ===== PRODUCT DETAIL MODAL ===== -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div id="modalContent">
                <div class="modal-emoji" id="modalEmoji">📦</div>
                <img class="modal-img" id="modalImage" src="" alt="Product" style="display:none;" />
                <div class="modal-name" id="modalName">Product Name</div>
                <div class="modal-desc" id="modalDesc">Description</div>
                <div class="modal-price" id="modalPrice">৳0.00</div>
                <div class="modal-stock" id="modalStock">In stock</div>
                <button class="modal-add-btn" id="modalAddBtn">
                    <i class="fas fa-plus-circle"></i> Add to Order
                </button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast">✅ Done</div>

    <script>
        // ======================== FIREBASE CONFIG ========================
        const firebaseConfig = {
            apiKey: "AIzaSyDsTcOmQx8HdwP9cF_vIA8rEkh1Q6V3y5w",
            authDomain: "one-page-store-aug-26.firebaseapp.com",
            databaseURL: "https://one-page-store-aug-26-default-rtdb.firebaseio.com",
            projectId: "one-page-store-aug-26",
            storageBucket: "one-page-store-aug-26.firebasestorage.app",
            messagingSenderId: "186091391204",
            appId: "1:186091391204:web:22612de5b8c1bec23ac4f1",
            measurementId: "G-VK3YDLKL26"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ======================== STATE ========================
        let products = [];
        let cart = {};
        let currentView = 'grid'; // 'grid' or 'list'

        // ======================== DOM REFS ========================
        const grid = document.getElementById('productGrid');
        const detailList = document.getElementById('productDetailList');
        const listItems = document.getElementById('productListItems');
        const productCountBadge = document.getElementById('productCountBadge');
        const orderList = document.getElementById('orderItemsList');
        const totalPriceEl = document.getElementById('totalPrice');
        const custName = document.getElementById('custName');
        const custAddress = document.getElementById('custAddress');
        const custPhone = document.getElementById('custPhone');
        const custNotes = document.getElementById('custNotes');
        const submitBtn = document.getElementById('submitOrderBtn');
        const toast = document.getElementById('toast');
        const cartBadge = document.getElementById('cartBadge');
        const cartToggle = document.getElementById('cartToggle');
        const gridViewBtn = document.getElementById('gridViewBtn');
        const listViewBtn = document.getElementById('listViewBtn');

        // Modal
        const modal = document.getElementById('productModal');
        const modalClose = document.getElementById('modalClose');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalImage = document.getElementById('modalImage');
        const modalName = document.getElementById('modalName');
        const modalDesc = document.getElementById('modalDesc');
        const modalPrice = document.getElementById('modalPrice');
        const modalStock = document.getElementById('modalStock');
        const modalAddBtn = document.getElementById('modalAddBtn');
        let currentModalProductId = null;

        // ======================== CURRENCY ========================
        const formatBDT = (amount) => '৳' + amount.toFixed(2);

        // ======================== LOAD PRODUCTS ========================
        async function loadProducts() {
            try {
                grid.innerHTML =
                `<div class="loading-msg"><i class="fas fa-spinner fa-pulse"></i> Loading products...</div>`;
                listItems.innerHTML = `<div class="empty-msg" style="padding:20px 0;">Loading products...</div>`;

                const snap = await db.collection('products').orderBy('name').get();
                products = [];
                snap.forEach(doc => {
                    products.push({ id: doc.id, ...doc.data() });
                });

                if (products.length === 0) {
                    await seedDefaultProducts();
                    const newSnap = await db.collection('products').orderBy('name').get();
                    products = [];
                    newSnap.forEach(doc => {
                        products.push({ id: doc.id, ...doc.data() });
                    });
                }

                renderVisitorProducts();
                renderProductList();
            } catch (error) {
                console.error('Error loading products:', error);
                if (error.code === 'permission-denied') {
                    const errHtml = `
                        <div class="error-msg" style="grid-column:1/-1;">
                            <i class="fas fa-exclamation-triangle" style="font-size:1.5rem;display:block;margin-bottom:8px;"></i>
                            <strong>⚠️ Permission Error</strong>
                            <p style="margin:8px 0;">Unable to load products. Please update Firestore security rules.</p>
                            <button onclick="location.reload()"><i class="fas fa-rotate"></i> Retry</button>
                        </div>
                    `;
                    grid.innerHTML = errHtml;
                    listItems.innerHTML = `<div class="empty-msg" style="padding:20px 0;">⚠️ Failed to load products</div>`;
                } else {
                    grid.innerHTML =
                        `<div class="error-msg" style="grid-column:1/-1;">⚠️ Failed to load products: ${error.message}</div>`;
                    listItems.innerHTML =
                        `<div class="empty-msg" style="padding:20px 0;">⚠️ Failed to load products</div>`;
                }
            }
        }

        async function seedDefaultProducts() {
            const defaults = [
                { name: "Wireless Earbuds", price: 49.99, emoji: "🎧", desc: "Crystal clear sound, noise cancellation, 8hr battery" },
                { name: "Smart Watch", price: 89.00, emoji: "⌚", desc: "Track fitness, heart rate, notifications, GPS" },
                { name: "Bluetooth Speaker", price: 39.50, emoji: "🔊", desc: "Portable, waterproof, 12hr playtime" },
                { name: "USB-C Hub", price: 29.99, emoji: "🔌", desc: "7-in-1 adapter, 4K HDMI, USB 3.0, SD card" },
                { name: "Phone Stand", price: 15.90, emoji: "📱", desc: "Adjustable angle, sturdy aluminum, foldable" },
                { name: "LED Desk Lamp", price: 24.90, emoji: "💡", desc: "Touch dimmer, adjustable arm, eye-caring" },
            ];
            for (const p of defaults) {
                try { await db.collection('products').add(p); } catch (e) { console.warn('Seed failed:', e); }
            }
        }

        // ======================== RENDER GRID VIEW ========================
        function renderVisitorProducts() {
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML =
                '<div class="empty-msg" style="grid-column:1/-1;padding:30px 0;">No products available.</div>';
                return;
            }
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const qty = cart[p.id] || 0;
                const imgHtml = p.image ?
                    `<img class="product-img" src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.querySelector('.emoji-big').style.display='block';" />` :
                    '';
                card.innerHTML = `
                    ${imgHtml}
                    <span class="emoji-big" style="${p.image ? 'display:none;' : ''}">${p.emoji || '📦'}</span>
                    <div class="product-name">${p.name}</div>
                    <div class="product-desc">${p.desc || ''}</div>
                    <div class="price-tag">${formatBDT(p.price)}</div>
                    <button class="order-btn" data-id="${p.id}">
                        <i class="fas fa-shopping-cart"></i> Order Now
                    </button>
                    ${qty > 0 ? `<span class="qty-badge">🛒 ${qty}</span>` : ''}
                    <span class="card-badge ${qty > 0 ? 'show' : ''}">${qty > 0 ? 'Added' : ''}</span>
                `;
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.order-btn')) {
                        showProductDetails(p.id);
                    }
                });
                const orderBtn = card.querySelector('.order-btn');
                orderBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(p.id);
                });
                grid.appendChild(card);
            });
            updateCartBadge();
        }

        // ======================== RENDER LIST VIEW ========================
        function renderProductList() {
            if (products.length === 0) {
                listItems.innerHTML = `<div class="empty-msg" style="padding:20px 0;">No products available.</div>`;
                productCountBadge.textContent = '0 items';
                return;
            }
            listItems.innerHTML = '';
            productCountBadge.textContent = `${products.length} items`;
            products.forEach(p => {
                const item = document.createElement('div');
                item.className = 'product-detail-item';
                const qty = cart[p.id] || 0;
                const imgHtml = p.image ?
                    `<img class="pdi-img" src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.textContent='${p.emoji || '📦'}';this.style.display='flex';this.style.alignItems='center';this.style.justifyContent='center';this.style.fontSize='1.5rem';" />` :
                    `<div class="pdi-img" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:#f0f4fc;">${p.emoji || '📦'}</div>`;
                const stockText = p.stock !== undefined ? (p.stock > 0 ? `${p.stock} in stock` : 'Out of stock') :
                'In stock';
                item.innerHTML = `
                    ${imgHtml}
                    <div class="pdi-info">
                        <div class="pdi-name">${p.name}</div>
                        <div class="pdi-desc">${p.desc || 'No description'}</div>
                        <div class="pdi-meta">
                            <span><i class="fas fa-box"></i> ${stockText}</span>
                            <span><i class="fas fa-tag"></i> ${formatBDT(p.price)}</span>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        ${qty > 0 ? `<span class="pdi-qty">${qty}</span>` : ''}
                        <button class="pdi-add" data-id="${p.id}">
                            <i class="fas fa-plus-circle"></i>
                        </button>
                    </div>
                `;
                item.addEventListener('click', (e) => {
                    if (!e.target.closest('.pdi-add')) {
                        showProductDetails(p.id);
                    }
                });
                const addBtn = item.querySelector('.pdi-add');
                addBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(p.id);
                });
                listItems.appendChild(item);
            });
        }

        // ======================== PRODUCT DETAIL MODAL ========================
        function showProductDetails(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            currentModalProductId = id;
            modalEmoji.textContent = p.emoji || '📦';
            if (p.image) {
                modalImage.src = p.image;
                modalImage.style.display = 'block';
                modalEmoji.style.display = 'none';
            } else {
                modalImage.style.display = 'none';
                modalEmoji.style.display = 'block';
            }
            modalName.textContent = p.name;
            modalDesc.textContent = p.desc || 'No description available.';
            modalPrice.textContent = formatBDT(p.price);
            const stock = p.stock !== undefined ? p.stock : 10;
            modalStock.textContent = stock > 0 ? `✅ In stock (${stock} available)` : '❌ Out of stock';
            modalStock.style.color = stock > 0 ? '#16a34a' : '#dc2626';
            modalAddBtn.textContent = cart[id] ? `🛒 ${cart[id]} in cart` : 'Add to Order';
            modal.classList.add('show');
        }

        modalClose.addEventListener('click', () => modal.classList.remove('show'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

        modalAddBtn.addEventListener('click', () => {
            if (currentModalProductId) {
                addToCart(currentModalProductId);
                const qty = cart[currentModalProductId] || 0;
                modalAddBtn.textContent = qty > 0 ? `🛒 ${qty} in cart` : 'Add to Order';
                modal.classList.remove('show');
            }
        });

        // ======================== VIEW TOGGLE ========================
        gridViewBtn.addEventListener('click', () => {
            currentView = 'grid';
            gridViewBtn.classList.add('active');
            listViewBtn.classList.remove('active');
            grid.style.display = 'grid';
            detailList.style.display = 'none';
            renderVisitorProducts();
        });

        listViewBtn.addEventListener('click', () => {
            currentView = 'list';
            listViewBtn.classList.add('active');
            gridViewBtn.classList.remove('active');
            grid.style.display = 'none';
            detailList.style.display = 'block';
            renderProductList();
        });

        // ======================== CART FUNCTIONS ========================
        function getProduct(id) { return products.find(p => p.id === id); }

        function addToCart(productId) {
            if (!cart[productId]) cart[productId] = 0;
            cart[productId] += 1;
            renderOrderSummary();
            if (currentView === 'grid') renderVisitorProducts();
            else renderProductList();
            const product = getProduct(productId);
            showToast(`🛒 ${product.name} added to cart`);
        }

        function removeFromCart(productId) {
            if (cart[productId]) {
                cart[productId] -= 1;
                if (cart[productId] <= 0) delete cart[productId];
            }
            renderOrderSummary();
            if (currentView === 'grid') renderVisitorProducts();
            else renderProductList();
        }

        function renderOrderSummary() {
            const entries = Object.entries(cart);
            let total = 0;
            let html = '';
            if (entries.length === 0) {
                html = `<li class="empty-msg">No items added yet.</li>`;
            } else {
                entries.forEach(([id, qty]) => {
                    const product = getProduct(id);
                    if (!product) return;
                    const subtotal = product.price * qty;
                    total += subtotal;
                    html += `
                        <li>
                            <div class="item-info">
                                <span class="item-emoji">${product.emoji || '📦'}</span>
                                <span><strong>${product.name}</strong> x${qty}</span>
                                <span style="color:#3a5a7a;font-weight:500;">${formatBDT(subtotal)}</span>
                            </div>
                            <button class="item-remove" data-id="${product.id}">
                                <i class="fas fa-minus-circle"></i>
                            </button>
                        </li>
                    `;
                });
            }
            orderList.innerHTML = html;
            totalPriceEl.textContent = formatBDT(total);
            updateCartBadge();
            document.querySelectorAll('.item-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    removeFromCart(id);
                });
            });
        }

        function updateCartBadge() {
            const total = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
            cartBadge.textContent = total;
            cartBadge.style.display = total > 0 ? 'block' : 'none';
        }

        // Scroll to order summary when clicking cart
        cartToggle.addEventListener('click', () => {
            document.getElementById('orderSummary').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // ======================== SUBMIT ORDER ========================
        async function submitOrder() {
            const name = custName.value.trim();
            const address = custAddress.value.trim();
            const phone = custPhone.value.trim();
            const notes = custNotes.value.trim();
            if (!name || !address || !phone) {
                showToast('⚠️ Please fill in all required fields');
                return;
            }
            const items = Object.entries(cart).map(([id, qty]) => {
                const p = getProduct(id);
                return { name: p.name, qty, price: p.price, emoji: p.emoji || '📦' };
            });
            if (items.length === 0) {
                showToast('⚠️ Your cart is empty');
                return;
            }
            const total = items.reduce((sum, it) => sum + it.price * it.qty, 0);
            const order = {
                customer: name,
                address,
                phone,
                notes: notes || '',
                items,
                total,
                date: new Date().toISOString(),
                status: 'pending'
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Placing...';

            try {
                await db.collection('orders').add(order);
                cart = {};
                renderOrderSummary();
                if (currentView === 'grid') renderVisitorProducts();
                else renderProductList();
                custName.value = '';
                custAddress.value = '';
                custPhone.value = '';
                custNotes.value = '';
                showToast('✅ Order placed successfully!');
            } catch (error) {
                console.error('Error placing order:', error);
                showToast('❌ Failed to place order. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Place Order';
            }
        }

        // ======================== TOAST ========================
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ======================== INIT ========================
        loadProducts();
        submitBtn.addEventListener('click', submitOrder);
    </script>
</body>
</html>
